version: '3.8'

services:
  antelligence:
    image: 983240697534.dkr.ecr.us-east-1.amazonaws.com/antelligence:latest
    ports:
      - "8001:8001"
    environment:
      # API Keys - Required for LLM functionality
      - IO_SECRET_KEY=${IO_SECRET_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      
      # Blockchain Configuration - Base Sepolia Testnet
      - BASE_SEPOLIA_RPC_URL=${BASE_SEPOLIA_RPC_URL:-}
      - CHAIN_RPC=${CHAIN_RPC:-}
      - PRIVATE_KEY=${PRIVATE_KEY:-}
      - FOOD_ADDR=${FOOD_ADDR:-}
      - MEMORY_ADDR=${MEMORY_ADDR:-}
      - TUMOR_INTEL_ADDR=${TUMOR_INTEL_ADDR:-}
      
      # Production Environment
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://44.220.130.72:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s 